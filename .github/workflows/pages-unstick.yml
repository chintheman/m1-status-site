name: pages-unstick

# GitHub's legacy Pages builder sometimes stalls on a deployment: the build sits in
# "building", the deploy job waits out its 600s timeout, and every following push is
# rejected with "in progress deployment" until someone cancels it by hand. The site
# then serves stale data while the repo is already fresh.
#
# This job only ever acts on THAT state: repo data is newer than the published data,
# and the published data is older than STALE_S. It never rebuilds on a stale collector,
# so a real M1 outage still shows up as a stale heartbeat instead of being papered over.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a rebuild (test path)'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write

concurrency:
  group: pages-unstick
  cancel-in-progress: false

jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: rebuild when the live site lags the repo
        env:
          REPO_JSON: https://raw.githubusercontent.com/chintheman/m1-status-site/main/data/latest-public.json
          LIVE_JSON: https://chintheman.github.io/m1-status-site/data/latest-public.json
          STALE_S: '1200'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          FORCE: ${{ inputs.force }}
        run: |
          python3 - <<'PYEOF'
          import json, os, time, datetime, urllib.request

          STALE = int(os.environ["STALE_S"])
          FORCE = os.environ.get("FORCE", "").lower() == "true"
          REPO = os.environ["REPO"]
          TOKEN = os.environ["GH_TOKEN"]

          def fetch_ts(url):
              req = urllib.request.Request(url, headers={"User-Agent": "pages-unstick", "Cache-Control": "no-cache"})
              d = json.load(urllib.request.urlopen(req, timeout=20))
              return datetime.datetime.fromisoformat(d["ts"]).timestamp()

          def rebuild():
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}/pages/builds",
                  method="POST",
                  data=b"{}",
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pages-unstick",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"rebuild requested -> {r.status} {r.read().decode()[:200]}")

          if FORCE:
              print("forced by workflow_dispatch")
              rebuild()
              raise SystemExit(0)

          now = time.time()
          try:
              repo_ts = fetch_ts(os.environ["REPO_JSON"])
          except Exception as e:
              print(f"repo fetch failed, not acting: {e}")
              raise SystemExit(0)
          try:
              live_ts = fetch_ts(os.environ["LIVE_JSON"])
          except Exception as e:
              print(f"live fetch failed, not acting: {e}")
              raise SystemExit(0)

          live_age = now - live_ts
          lag = repo_ts - live_ts
          print(f"live age={int(live_age)}s repo-newer-by={int(lag)}s")

          # Only a publishing stall looks like this. A dead collector leaves BOTH timestamps
          # old together, and must not be masked by a rebuild that republishes stale data.
          if live_age > STALE and lag > 300:
              print("publishing stall detected: repo is fresh, live site is not")
              rebuild()
          else:
              print("no stall, nothing to do")
          PYEOF
